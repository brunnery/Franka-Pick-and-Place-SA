# Loaded by the spawner when cartesian_impedance_controller.launch.py runs with start_pose:=false
# (task.launch.py): no start move at activation, the arm holds the pose it is in. The sa_tasks
# steps go to their observation pose themselves (20.10.: the start move sent the arm to
# [0.5, 0, 0.5] before every place run).
cartesian_impedance_controller:
  ros__parameters:
    start_pose:
      enabled: false
