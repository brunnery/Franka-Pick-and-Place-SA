# sa_vision/vision_node (all parameters are declared from this file). docs/THEORY.md 2.0.
vision_node:
  ros__parameters:
    debug_steps_scale: 0.75         # vision/debug: binary | result side by side (0.5 until 21.10.)
    # Set by sa_tasks with every request (which starts the tracks over):
    target: nut                     # nut | stud: selects targets.<target>
    lock: false                     # true: lock on confirmed objects (stud at observe_stud)
    object_plane_distance_mm: 400.0 # d to the top face: sizes in mm (s = s_px * d / f)
    # Objects are tracked over the images; positions and sizes are the medians of the last
    # `frames` finds. With lock only tracks with `frames` finds count, and after
    # lock_after_frames images the result is fixed until the next request.
    tracking:
      frames: 5
      # About 7.5 mm at d = 400 mm. 20.10.: 15 px (3 mm) was smaller than the jumps of the
      # stud's centre, its track kept breaking and it never counted
      match_radius_px: 40.0
      max_misses: 3                 # images in a row without the object before its track ends
      # 10 until 27.10. (the stud's first look took 0.7-1.5 s); must stay >= frames, else nothing
      # has been seen often enough to count when the lock is taken
      lock_after_frames: 6
    detection:
      blur_kernel_px: 5             # Gaussian kernel against sensor noise, odd
      # Background = the image blurred with this sigma: much larger than the object
      # (M8 nut: ~60 px at 400 mm), so the object hardly changes it
      background_sigma_px: 60.0
      background_downscale: 8       # blur computed at 1/8 resolution (speed)
      # segmentation band: foreground if |I/B - 1| > this, darker or brighter than the table.
      # Live 19.10.: 0.18 best (table 0.9-1.1, shadow 0.8-0.9)
      threshold: 0.18
      morph_kernel_px: 7            # closing joins the parts of the object, opening drops specks
      close_iterations: 2
      min_area_px: 300              # smaller blobs count as noise
      border_margin_px: 2           # blobs this close to the image border are ignored
      angle_step_deg: 1.0           # orientation search of the polygon fit and width ratio
    targets:
      # Nut: with several objects in view only those with the width ratio of the hull
      # (smallest / largest width) in [min, max] count, and of several of those the one
      # closest to target_size_mm (within size_tolerance)
      nut:
        sides: 6
        segmentation: band
        inner_circle_mm: 0.0        # overlay only, 0 = none
        # Hexagon 0.866 (bench 16.10. with shadow 0.62-0.82), lying bolt well below, washer ~1
        min_width_ratio: 0.6
        max_width_ratio: 0.95
        # The soft shadow makes s about 30 % too large (bench: 17 mm for the 13 mm nut)
        target_size_mm: 13.0        # M8
        size_tolerance: 0.4
      # Stud: candidates from the loose search_* filter, ranked by area; the strict band
      # (shape_ok) is judged by sa_tasks with the camera centred over a candidate
      stud:
        sides: 4                    # square base 10 x 10 mm, the M8 thread stands inside it
        # dark: I/B < dark_threshold. The soft shadow (0.8-0.9 x table) made the base 16 mm
        # instead of 10 mm and turned the square (20.10.); the base itself is nearly black
        segmentation: dark
        dark_threshold: 0.6
        inner_circle_mm: 8.0        # overlay: the M8 thread inside the square
        min_width_ratio: 0.6        # square 0.707
        max_width_ratio: 0.82
        target_size_mm: 10.0
        # 0.4 until 21.10. TEMPORARY 0.8 (2-18 mm): the makeshift stud fixture enlarges the
        # dark square (centred 12.6-16.7 mm instead of 11.3-12.1); back to 0.4 with the real one
        size_tolerance: 0.8
        # Seen off-axis the stud is no square (17.7 mm, w 0.56-0.60 at 46 mm from the axis).
        # Drops specks and lines (table marks, w 0.3). 20.10.: 8 mm lost the stud (8.06 mm)
        search_min_size_mm: 6.0
        search_max_size_mm: 40.0
        search_min_width_ratio: 0.4
        # Edge refinement of the centre (THEORY 2.0, 21.10.): the blob includes part of the
        # soft shadow on one side; a pair of lines target_size_mm apart is shifted onto the
        # sharp base edges. Dry test 21.10.: 0.2-0.7 mm correction with the camera centred
        refine_edges: true
        refine_search_fraction: 0.25  # +- this fraction of the side
        refine_step_px: 0.25
        refine_side_fraction: 0.8     # sampled part of each side (corners left out)
        refine_samples: 25
