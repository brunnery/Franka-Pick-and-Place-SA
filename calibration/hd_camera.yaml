# Intrinsic calibration of the eye-in-hand USB camera (HutoPi 720p, OV9726)
# Date: 19.10.2026, ROS 2 camera_calibration (mono pinhole, plumb_bob)
# Board: 9x12 squares (8x11 inner corners), 30 mm squares
# Mean of three independent runs (73, 74, 57 samples, fresh images each, camera fixed,
# board moved). Spread between runs (std): fx 2.9, fy 4.8, cx 7.9, cy 5.1 px; on the table
# at d = 416 mm the runs differ from their mean by <= 2.1 mm. Previous calibration
# (14.10.: fx 2077.2, fy 2083.7, cx 695.4, cy 405.6) lies within 0.75 mm of this mean.
# Per run (fx, fy, cx, cy):
#   1: 2093.670318, 2088.291584, 687.117029, 407.234242
