#   3: 2095.112382, 2091.133150, 702.963603, 406.847769
# Projection matrix: cv2.getOptimalNewCameraMatrix(K, D, alpha = 0), as the calibrator does.
# Valid only for 1280x720. Recalibrate after changing the resolution or the lens.
